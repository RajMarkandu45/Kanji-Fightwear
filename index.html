<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kanji Fightwear</title>
<style>
* {
box-sizing: border-box;
margin: 0;
padding: 0;
font-family: Arial, Helvetica, sans-serif;
color: #b3b3b3; /* all text grey */
}


body {
background: #000;
}


header {
display: flex;
justify-content: space-between;
align-items: center;
padding: 20px 40px;
border-bottom: 1px solid #222;
}


header img {
height: 48px;
width: 48px;
border-radius: 50%; /* badge style */
}


nav a {
margin-left: 24px;
text-decoration: none;
font-size: 14px;
letter-spacing: 1px;
}


.hero {
height: 80vh;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
text-align: center;
background: radial-gradient(circle at center, #111 0%, #000 70%);
}


.hero h1 {
font-size: 64px;
letter-spacing: 4px;
margin-bottom: 16px;
}


.hero p {
max-width: 600px;
font-size: 16px;
line-height: 1.6;
}


.products {
padding: 80px 40px;
display: grid;
grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
gap: 40px;
}


.product {
border: 1px solid #222;
padding: 24px;
text-align: center;
}


.product img {
width: 100%;
margin-bottom: 16px;
filter: grayscale(100%);
}


.product h3 {
font-size: 18px;
margin-bottom: 8px;
}


</html>
