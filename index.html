<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanji Fightwear</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; background: #111; color: #fff; }
  header { background: #000; padding: 20px; text-align: center; }
  header h1 { color: #f00; font-size: 2.5em; }
  nav a { color: #fff; margin: 0 15px; text-decoration: none; font-weight: bold; }
  .hero { background: url('hero.jpg') center/cover no-repeat; height: 400px; display: flex; align-items: center; justify-content: center; }
  .hero h2 { color: #fff; background: rgba(0,0,0,0.5); padding: 20px; }
  .products { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; padding: 40px; }
  .product { background: #222; padding: 20px; text-align: center; border-radius: 10px; }
  .product img { max-width: 100%; border-radius: 10px; }
  .product h3 { margin: 10px 0; color: #f00; }
  .product p { font-size: 0.9em; }
  footer { background: #000; text-align: center; padding: 20px; font-size: 0.9em; }
</style>
</head>
<body>

<header>
  <h1>Kanji Fightwear</h1>
  <nav>
    <a href="#">Home</a>
    <a href="#">Shop</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </nav>
</header>

<section class="hero">
  <h2>Unleash the Fighter in You</h2>
</section>

<section class="products">
  <div class="product">
    <img src="gloves.jpg" alt="Fight Gloves">
    <h3>Fight Gloves</h3>
    <p>Premium gloves built for performance. £45</p>
  </div>
  <div class="product">
    <img src="shirt.jpg" alt="Training Shirt">
    <h3>Training Shirt</h3>
    <p>Comfortable & durable fightwear. £35</p>
  </div>
  <div class="product">
    <img src="shorts.jpg" alt="Fight Shorts">
    <h3>Fight Shorts</h3>
    <p>Lightweight & flexible for all fights. £40</p>
  </div>
</section>

<footer>
  © 2026 Kanji Fightwear | Follow us on Instagram & TikTok
</footer>

</body>
</html>
